<head>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .reference-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('./assets/test.png');
            /* PASTE IMAGE URL HERE */
            background-size: no-repeat;
            background-position: top left;
            opacity: 1;
            pointer-events: none;
            z-index: -1;

        }

        .scorecard-container {
            width: 100%;
            height: 9%;
            margin-top: 3%;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        .scorecard {
            position: relative;
            width: 40%;
            height: 100%;
            background-color: rgba(0, 0, 0, 1);
            z-index: 1;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        .gamecard-container {
            position: absolute;
            aspect-ratio: 1;
            left: 45%;
            top: 4.5%;
            height: 10%;
            z-index: 2;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-color: aqua;
            overflow: visible;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .gamecard {
            position: relative;
            height: auto;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="reference-background">
        <div class="scorecard-container">
            <div class="scorecard">
            </div>
        </div>
        <div class="gamecard-container">
            <img class="gamecard"
                src="https://image.pngaaa.com/70/8138070-middle.png">
        </div>
</body>

</html>
